[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Arena
Description=Classic arena shooter with GoldSrc-style bunnyhop movement

[/Script/Engine.GameSession]
MaxPlayers=16

[/Script/Arena.ArenaGameMode]
