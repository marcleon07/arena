[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Raw mouse: no smoothing, no FOV scaling, no legacy 2.5x yaw/pitch scale.
; Look is computed Quake-style in AArenaCharacter::OnLook (0.022 deg/count * sensitivity).
bEnableMouseSmoothing=False
bEnableFOVScaling=False
bEnableLegacyInputScales=False
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockAlways

; Pass mouse counts through unscaled (engine default sensitivity is 0.07).
!AxisConfig=ClearArray
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
+AxisConfig=(AxisKeyName="Mouse2D",AxisProperties=(DeadZone=0.000000,Sensitivity=1.000000,Exponent=1.000000,bInvert=False))
